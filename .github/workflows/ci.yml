name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guidance
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/guidance
      DB_SSL_REQUIRE: "false"
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      # Settings refuse to load without an encryption key outside DEBUG, so give
      # every step a throwaway one. It only ever encrypts CI's temporary data.
      - name: Generate throwaway encryption key
        run: |
          key="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::$key"
          echo "FIELD_ENCRYPTION_KEYS=$key" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (PostgreSQL)
        run: python manage.py test

      - name: Production checks
        env:
          VERCEL: "1"
          VERCEL_ENV: production
          VERCEL_URL: ci.example.vercel.app
          CRON_SECRET: ci
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py collectstatic --noinput
