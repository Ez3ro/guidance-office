<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyCacheSize": 0}'>
  <title>{% block title %}{% endblock %} · {{ SITE_NAME }}</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>
  {% include "includes/nav.html" %}
  <main id="main" class="container-xl py-4">
    {% include "includes/messages.html" %}
    {% block content %}{% endblock %}
  </main>
  <footer class="container-xl pb-4 small text-body-secondary d-print-none">
    <i class="bi bi-lock"></i> Confidential learner records. Access is logged. Handle in line with RA 10173 (Data Privacy Act of 2012) and DepEd's child protection policies.
  </footer>
</body>
</html>
