<header class="app-topbar d-print-none">
  <button class="topbar-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#appSidebar" aria-controls="appSidebar" aria-label="Open menu">
    <i class="bi bi-list"></i>
  </button>
  <div class="topbar-context">
    {% if school.name and school.name != "Name of School" %}<span class="topbar-school">{{ school.name }}</span>{% endif %}
  </div>
  <div class="topbar-actions">
    {% include "includes/theme_toggle.html" %}
    <div class="dropdown">
      <button class="user-chip" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="user-avatar" aria-hidden="true">{{ user.display_name|slice:":1"|upper }}</span>
        <span class="user-meta">
          <span class="user-name">{{ user.display_name }}</span>
          <span class="user-role">{{ user.get_role_display }}{% if user.is_cpc_member %} · CPC{% endif %}</span>
        </span>
        <i class="bi bi-chevron-down small"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{% url 'accounts:password_change' %}"><i class="bi bi-key me-2"></i>Change password</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-left me-2"></i>Sign out</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
